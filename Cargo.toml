[package]
name = "urlmenu"
version = "0.1.1"
edition = "2024"
description = "Pick a browser for each link through your dmenu-style launcher"
readme = "README.md"
repository = "https://github.com/bitxikeria/urlmenu"
rust-version = "1.88"
license = "Unlicense"
keywords = ["browser", "rofi", "dmenu", "xdg", "linux"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = { version = "4.6.12", features = ["unstable-dynamic"] }
globset = "0.4.21"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
url = "2.5.8"

[dev-dependencies]
clap_mangen = "0.3.4"
