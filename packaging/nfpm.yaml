# .deb and .rpm from the tree packaging/install.sh writes:
#   PREFIX=/usr DESTDIR="$PKGROOT" packaging/install.sh
#   VERSION=0.1.1 ARCH=amd64 PKGROOT=... nfpm package -f packaging/nfpm.yaml -p deb
name: urlmenu
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: web
priority: optional
maintainer: Séverin Dupouy <dev@txukun.eu>
vendor: bitxikeria
homepage: https://github.com/bitxikeria/urlmenu
license: Unlicense
description: |-
  Pick a browser for each link through your dmenu-style launcher.
  A link handler that asks which browser, profile or private window opens
  each link, through rofi, fuzzel, wofi, tofi, walker, bemenu or dmenu.
depends:
  - xdg-utils
recommends:
  - wl-clipboard | xclip
overrides:
  rpm:
    recommends:
      - (wl-clipboard or xclip)
contents:
  - src: ${PKGROOT}/usr/
    dst: /usr/
    type: tree
    expand: true
