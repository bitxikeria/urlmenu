name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            deb_arch: amd64
            nfpm_arch: x86_64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            deb_arch: arm64
            nfpm_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Tag matches Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "v$version" = "$GITHUB_REF_NAME"
      - run: sudo apt-get install -y musl-tools
      - run: cargo test --locked
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Archive
        run: |
          name=urlmenu-$GITHUB_REF_NAME-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/urlmenu "$name/"
          cp -r packaging config.sample.toml README.md CHANGELOG.md UNLICENSE "$name/"
          tar -czf "$name.tar.gz" "$name"
      - uses: ./.github/actions/nfpm
        with:
          arch: ${{ matrix.nfpm_arch }}
      - name: .deb and .rpm
        run: packaging/build-packages.sh target/${{ matrix.target }}/release/urlmenu "${GITHUB_REF_NAME#v}" ${{ matrix.deb_arch }} .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            urlmenu-*.tar.gz
            urlmenu*.deb
            urlmenu*.rpm

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum urlmenu* > SHA256SUMS
      - name: Notes from CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            /^## \[/ { if (on) exit; on = index($0, "[" v "]") > 0; next }
            on' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md dist/*
