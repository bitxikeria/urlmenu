name: nfpm
description: Install a pinned nfpm release, checked against its checksums.
inputs:
  arch:
    description: Release asset architecture, x86_64 or arm64.
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        NFPM_VERSION: 2.48.0
        ARCH: ${{ inputs.arch }}
        GH_TOKEN: ${{ github.token }}
      run: |
        dir=$RUNNER_TEMP/nfpm
        mkdir -p "$dir"
        cd "$dir"
        asset=nfpm_${NFPM_VERSION}_Linux_$ARCH.tar.gz
        gh release download "v$NFPM_VERSION" -R goreleaser/nfpm -p "$asset" -p checksums.txt
        grep " $asset\$" checksums.txt | sha256sum -c
        tar xzf "$asset" nfpm
        echo "$dir" >> "$GITHUB_PATH"
